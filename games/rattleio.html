:root{color-scheme:dark;--bg:#1a1230;--ink:#efe3c8;--gold:#39ff6a;--red:#7a2bff;--panel:rgba(22,8,52,.7);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Oswald,Impact,"Arial Narrow",sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(10,5,25,.6))}
#ov{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:20px;text-align:center;overflow-y:auto;touch-action:pan-y;background:radial-gradient(ellipse at center,rgba(26,18,48,.3),rgba(26,18,48,.85))}
#logo{width:min(360px,70vw);filter:hue-rotate(115deg) saturate(1.2)}
#msg{font-size:22px;color:var(--gold);line-height:1.4}
#opt{display:grid;gap:4px;width:min(300px,80vw);font-size:18px}#opt label{display:flex;justify-content:space-between}#opt b{color:var(--gold);font-weight:400}#opt input{width:100%;accent-color:var(--gold);touch-action:pan-x}
#skin{display:flex;flex-direction:column;align-items:center;gap:8px}
#pv{width:min(300px,80vw);height:auto}
#pt{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:340px}
#pt div{padding:1px 12px;border-radius:999px;border:2px solid rgba(160,90,255,.6);font-size:15px;cursor:pointer;background:rgba(22,8,52,.6)}
#pt .on{background:var(--gold);color:#12082a;border-color:var(--gold)}
#cp{display:flex;gap:18px;align-items:center;font-size:16px}
#cp label{display:flex;align-items:center;gap:8px}
#cp input{width:48px;height:34px;padding:0;border:2px solid var(--ink);border-radius:8px;background:none;cursor:pointer}
#hint{font-size:15px;color:#a595c8;max-width:420px}
#nm{width:min(280px,76vw);height:48px;font:22px Oswald,Impact,sans-serif;letter-spacing:.04em;text-align:center;color:var(--ink);background:#2a1d4a;border:2px solid var(--ink);border-radius:14px;outline:none}
#nm:focus{border-color:var(--gold)}
button{font:34px Oswald,Impact,sans-serif;color:#1a1230;padding:4px 56px;border-radius:999px;border:none;background:linear-gradient(#5dff8a,#1fd45a);cursor:pointer}
button:active{transform:translateY(2px)}
#hud{position:fixed;inset:0;z-index:2;pointer-events:none;display:none}
.pn{position:absolute;background:var(--panel);border:1px solid rgba(160,90,255,.5);border-radius:12px}
#lb{top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:190px;overflow:hidden;padding-bottom:4px}
#lb h4{background:var(--red);font:italic 400 14px Oswald,sans-serif;letter-spacing:.08em;text-align:center;padding:3px;margin-bottom:3px}
#lb div{display:flex;justify-content:space-between;padding:1px 10px;font-size:15px;gap:8px}
#lb .me{color:var(--gold)}
#st{top:calc(10px + env(safe-area-inset-top,0px));left:10px;padding:5px 14px;font-size:20px}
#st b{color:var(--gold);font-weight:400}
#fx{position:absolute;top:calc(58px + env(safe-area-inset-top,0px));left:10px;display:flex;flex-direction:column;gap:6px}
.chip{padding:2px 12px;border-radius:999px;font-size:15px;border:2px solid;background:var(--panel);width:max-content}
#map{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(42,29,74,.7);border:2px solid var(--red)}
#bst{display:none;pointer-events:auto;position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:88px;height:88px;padding:0;font-size:18px;border-width:3px}
@media(pointer:coarse){#bst{display:block}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">
 <div id="st" class="pn"></div><div id="fx"></div><div id="lb" class="pn"></div>
 <canvas id="map" width="260" height="260"></canvas>
 <button id="bst">BOOST</button>

/* ---------- world state ---------- */
const worms=[],foods=[],respawns=[];
let me=null,state='menu',time=0,runStart=0,hudT=0,mx=0,my=0,hold=false,key=false,btn=false;
let best=0;try{best=+localStorage.getItem('rattle_best')||0}catch(e){}
const cam={x:0,y:0,z:.6};

const spot=()=>{const a=rnd(0,TAU),r=Math.sqrt(Math.random())*ARENA*.85;return{x:Math.cos(a)*r,y:Math.sin(a)*r}};
function addFood(x,y,v,ci){foods.push({x,y,v,ci:ci??(Math.random()*COL.length|0),p:rnd(0,TAU)});if(foods.length>FOODS*2.2)foods.splice(0,200)}

class Worm{
 constructor(name,bot){
  const p=spot();
  this.name=name;this.bot=bot;this.ci=Math.random()*COL.length|0;this.alive=true;
  this.a=this.want=rnd(0,TAU);this.len=bot?rnd(12,35):12;this.kills=0;this.boost=false;
  this.grace=1.5;this.rat=0;this.drop=0;this.think=0;
  this.segs=[{x:p.x,y:p.y}];this.fix()}
 get n(){return Math.floor(this.len)}
 get r(){return Math.min(34,9+this.len*.055)}
 get gap(){return this.r*.62}
 fix(){while(this.segs.length<this.n){const l=this.segs[this.segs.length-1];this.segs.push({x:l.x-Math.cos(this.a)*this.gap,y:l.y-Math.sin(this.a)*this.gap})}
  if(this.segs.length>this.n)this.segs.length=Math.max(this.n,2)}
 step(dt){
  if(this.grace>0)this.grace-=dt;
  const tr=TURN*(1-Math.min(.5,this.len/1500))*(this.bot?DIF.turn:1)*dt;
  this.a+=clamp(wrap(this.want-this.a),-tr,tr);
  const paid=this.boost&&this.len>MINLEN+1;this.rat+=dt*(paid?42:16);
  const sp=(paid?BOOST:SPEED)*(this.bot?DIF.spd:1),h=this.segs[0];
  h.x+=Math.cos(this.a)*sp*dt;h.y+=Math.sin(this.a)*sp*dt;
  if(paid){this.len-=dt*3;this.drop+=dt;
   if(this.drop>.22){this.drop=0;const t=this.segs[this.segs.length-1];addFood(t.x,t.y,.7,this.ci)}}
  this.fix();
  const gap=this.gap;
  for(let i=1;i<this.segs.length;i++){const p=this.segs[i-1],q=this.segs[i],dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy);
   if(d>gap){const k=(d-gap)/d;q.x+=dx*k;q.y+=dy*k}}}
 eat(dt){
  const h=this.segs[0],reach=this.r+9,pull=reach+45;
  for(let i=foods.length-1;i>=0;i--){const f=foods[i],dx=h.x-f.x,dy=h.y-f.y,d2=dx*dx+dy*dy;
   if(d2<reach*reach){this.len+=f.v*.5;foods[i]=foods[foods.length-1];foods.pop()}
   else if(d2<pull*pull){const d=Math.sqrt(d2),k=Math.min(d,260*dt)/d;f.x+=dx*k;f.y+=dy*k}}}
}

/* ---------- bots ---------- */
function think(w,dt){
 w.think-=dt;if(w.think>0)return;w.think=rnd(.1,.2)*DIF.t;
 const h=w.segs[0];let a=w.a,boost=false;
 if(Math.hypot(h.x,h.y)>ARENA-350){a=Math.atan2(-h.y,-h.x)}
 else{
  const L=(90+w.r*4)*DIF.look;let dang=0,prey=null;
  for(const o of worms){if(o===w||!o.alive)continue;const oh=o.segs[0];
   if(DIF.hunt&&w.len>30&&o.len<w.len*.8){const dx=oh.x-h.x,dy=oh.y-h.y;if(dx*dx+dy*dy<450*450&&(!prey||o.len>prey.len))prey=o}
   for(let i=0;i<o.segs.length;i+=2){const s=o.segs[i],dx=s.x-h.x,dy=s.y-h.y;
    if(dx*dx+dy*dy<L*L){const rel=wrap(Math.atan2(dy,dx)-w.a);if(Math.abs(rel)<1.1)dang+=rel>0?-1:1}}}
  if(dang!==0){a=w.a+Math.sign(dang)*1.3;boost=w.len>25&&Math.random()<DIF.bp}
  else if(prey){const o=prey.segs[0];a=Math.atan2(o.y+Math.sin(prey.a)*190-h.y,o.x+Math.cos(prey.a)*190-h.x);boost=Math.hypot(o.x-h.x,o.y-h.y)<320&&w.len>30}
  else{
   let bd=520*520,tx=null,ty=null;
   for(const f of foods){const dx=f.x-h.x,dy=f.y-h.y,d=dx*dx+dy*dy-f.v*900;if(d<bd){bd=d;tx=f.x;ty=f.y}}
   a=tx===null?w.a+rnd(-.6,.6):Math.atan2(ty-h.y,tx-h.x)}}
 w.want=a+rnd(-1,1)*DIF.noise;w.boost=boost}

/* ---------- collisions & death ---------- */
function hit(w){
 const h=w.segs[0];
 if(Math.hypot(h.x,h.y)>ARENA-w.r*.4)return'wall';
 for(const o of worms){if(o===w||!o.alive)continue;
  const oh=o.segs[0],ext=o.segs.length*o.gap+o.r*2+w.r,ex=oh.x-h.x,ey=oh.y-h.y;
  if(ex*ex+ey*ey>ext*ext)continue;
  const lim=(w.r+o.r)*.68,l2=lim*lim;
  for(let i=2;i<o.segs.length;i++){const s=o.segs[i],dx=s.x-h.x,dy=s.y-h.y;if(dx*dx+dy*dy<l2)return o}}
 return null}
function kill(w,by){
 if(!w.alive)return;w.alive=false;if(by)by.kills++;
 for(let i=0;i<w.segs.length;i+=2){const s=w.segs[i];addFood(s.x+rnd(-8,8),s.y+rnd(-8,8),1.4+w.len/60,w.ci)}
 if(w===me)over(by);else respawns.push(time+rnd(2,4))}

/* ---------- game flow ---------- */
const ov=$('#ov'),hud=$('#hud'),nm=$('#nm');
const c1=$('#c1'),c2=$('#c2'),pt=$('#pt'),pv=$('#pv').getContext('2d');let pat='stripe';
const curSkin=()=>({t:pat,b:c1.value,a:c2.value});
function paint(){
 for(const d of pt.children)d.classList.toggle('on',d.dataset.p===pat);
 $('#c2w').style.display=pat==='solid'?'none':'flex';
 pv.clearRect(0,0,300,76);const S=[];for(let i=0;i<30;i++)S.push({x:262-i*7.4,y:38+Math.sin(i*.4)*10});
 skinBody(pv,curSkin(),S,30,12);
 for(const e of[-1,1]){pv.fillStyle='#fff';pv.beginPath();pv.arc(266,38+6*e,4.5,0,TAU);pv.fill();pv.fillStyle='#14102a';pv.beginPath();pv.arc(267.5,38+6*e,2.2,0,TAU);pv.fill()}}
pt.onclick=e=>{if(e.target.dataset.p){pat=e.target.dataset.p;paint()}};
c1.oninput=c2.oninput=paint;
try{const o=JSON.parse(localStorage.getItem('rattle_skin'));if(o){pat=o[0];c1.value=o[1];c2.value=o[2]}}catch(e){}
paint();
const bn=$('#bn'),df=$('#df');
const lab=()=>{$('#bv').textContent=bn.value;$('#dv').textContent=DIFS[+df.value].n};
bn.oninput=df.oninput=lab;
try{const o=JSON.parse(localStorage.getItem('rattle_opt'));if(o){bn.value=o[0];df.value=o[1]}}catch(e){}
lab();
function reset(){
 NB=+bn.value;DIF=DIFS[+df.value];ARENA=1800+NB*28;FOODS=450+NB*8;
 worms.length=foods.length=respawns.length=0;me=null;
 for(let i=0;i<NB;i++)worms.push(new Worm(NAMES[Math.random()*NAMES.length|0],true))}
function start(){
 try{localStorage.setItem('rattle_opt',JSON.stringify([+bn.value,+df.value]));localStorage.setItem('rattle_skin',JSON.stringify([pat,c1.value,c2.value]))}catch(e){}
 reset();
 me=new Worm((nm.value.trim()||'Rattler').slice(0,14),false);me.skin=curSkin();worms.push(me);
 state='play';runStart=time;ov.style.display='none';hud.style.display='block'}
function over(by){
 state='dead';
 const L=Math.floor(me.len),t=Math.round(time-runStart);
 if(L>best){best=L;try{localStorage.setItem('rattle_best',L)}catch(e){}}
 setTimeout(()=>{if(state!=='dead')return;hud.style.display='none';ov.style.display='flex';
  $('#msg').innerHTML=`Rattled by ${esc(by?by.name:'the wall')}<br>Length ${L} · Kills ${me.kills} · ${t}s · Best ${best}`;
  $('#go').textContent='PLAY AGAIN'},900)}
$('#go').onclick=start;
nm.addEventListener('keydown',e=>{if(e.key==='Enter')start();e.stopPropagation()});

/* ---------- input ---------- */
const aim=e=>{mx=e.clientX-W/2;my=e.clientY-H/2};
addEventListener('pointermove',aim);
cv.addEventListener('pointerdown',e=>{aim(e);if(e.pointerType==='mouse')hold=true});
addEventListener('pointerup',()=>hold=false);
addEventListener('keydown',e=>{if(e.code==='Space'){key=true;e.preventDefault()}});
addEventListener('keyup',e=>{if(e.code==='Space')key=false});
const bst=$('#bst');
bst.addEventListener('pointerdown',e=>{btn=true;e.stopPropagation()});
for(const ev of['pointerup','pointercancel','pointerleave'])bst.addEventListener(ev,()=>btn=false);

/* ---------- update ---------- */
function update(dt){
 time+=dt;
 if(me&&me.alive){if(mx*mx+my*my>144)me.want=Math.atan2(my,mx);me.boost=hold||key||btn}
 for(const w of worms){if(!w.alive)continue;if(w.bot)think(w,dt);w.step(dt);w.eat(dt)}
 const dying=[];
 for(const w of worms){if(!w.alive)continue;
  if(w.grace>0){const h=w.segs[0],d=Math.hypot(h.x,h.y),m=ARENA-w.r;if(d>m){h.x*=m/d;h.y*=m/d}continue}
  const k=hit(w);if(k)dying.push([w,k==='wall'?null:k])}
 for(const[w,k]of dying)kill(w,k);
 for(let i=worms.length-1;i>=0;i--)if(!worms[i].alive)worms.splice(i,1);
 while(respawns.length&&respawns[0]<time){respawns.shift();const b=new Worm(NAMES[Math.random()*NAMES.length|0],true);worms.push(b)}
 while(foods.length<FOODS){const p=spot();addFood(p.x,p.y,rnd(.5,1))}
 let tgt=me&&me.alive?me:worms.reduce((a,b)=>!a||b.len>a.len?b:a,null);
 if(tgt){const h=tgt.segs[0],k=1-Math.exp(-5*dt),tz=Math.min(W,H)/(640+tgt.len*2.4);
  cam.x+=(h.x-cam.x)*k;cam.y+=(h.y-cam.y)*k;cam.z+=(tz-cam.z)*(1-Math.exp(-2*dt))}
 hudT-=dt;if(hudT<0&&state==='play'){hudT=.25;updateHud()}}

function updateHud(){
 $('#st').innerHTML=`LENGTH <b>${Math.floor(me.len)}</b> &nbsp; KILLS <b>${me.kills}</b>`;
 const top=worms.filter(w=>w.alive).sort((a,b)=>b.len-a.len).slice(0,8);
 $('#lb').innerHTML='<h4>LEADERBOARD</h4>'+top.map(w=>`<div class="${w===me?'me':''}"><span>${esc(w.name)}</span><span>${Math.floor(w.len)}</span></div>`).join('');}

/* ---------- render ---------- */
function skinBody(g,k,S,n,r){
 const h=S[0],tl=S[n-1];g.lineCap=g.lineJoin='round';
 if(k.t==='grad'){const gr=g.createLinearGradient(h.x,h.y,tl.x,tl.y);gr.addColorStop(0,k.b);gr.addColorStop(1,k.a);g.strokeStyle=gr}else g.strokeStyle=k.b;
 g.lineWidth=r*2;g.beginPath();g.moveTo(h.x,h.y);for(let i=1;i<n;i++)g.lineTo(S[i].x,S[i].y);g.stroke();
 if(k.t!=='solid'&&k.t!=='grad')pattern(g,k,S,n,r)}
function pattern(g,k,S,n,r){
 g.fillStyle=g.strokeStyle=k.a;g.lineWidth=k.t==='zigzag'?r*.55:r*.8;g.lineCap=k.t==='zigzag'?'round':'butt';g.beginPath();
 if(k.t==='zigzag'){
  for(let i=1;i<n;i+=3){const p=S[i],q=S[i-1],a=Math.atan2(q.y-p.y,q.x-p.x)+Math.PI/2,o=(i%6===1?1:-1)*r*.62,x=p.x+Math.cos(a)*o,y=p.y+Math.sin(a)*o;i>1?g.lineTo(x,y):g.moveTo(x,y)}
  g.stroke();return}
 for(let i=2;i<n;i+=3){const p=S[i],q=S[i-1],a=Math.atan2(q.y-p.y,q.x-p.x),c=Math.cos(a),s=Math.sin(a);
  if(k.t==='stripe'){g.moveTo(p.x-s*r,p.y+c*r);g.lineTo(p.x+s*r,p.y-c*r)}
  else if(k.t==='tri'){g.moveTo(p.x+c*r*.8,p.y+s*r*.8);g.lineTo(p.x-c*r*.5-s*r*.85,p.y-s*r*.5+c*r*.85);g.lineTo(p.x-c*r*.5+s*r*.85,p.y-s*r*.5-c*r*.85);g.closePath()}
  else{g.moveTo(p.x+r*.42,p.y);g.arc(p.x,p.y,r*.42,0,TAU)}}
 k.t==='stripe'?g.stroke():g.fill()}
function drawWorm(w){
 const r=w.r,S=w.segs,n=S.length,h=S[0],hw=W/2/cam.z+r*4,hh=H/2/cam.z+r*4;
 let vis=false;for(let i=0;i<n;i+=6){const q=S[i];if(Math.abs(q.x-cam.x)<hw&&Math.abs(q.y-cam.y)<hh){vis=true;break}}
 if(!vis)return;
 g.globalAlpha=w.grace>0&&Math.sin(time*20)>0?.45:1;
 skinBody(g,w.skin||SK[w.ci],S,n,r);
 const c=Math.cos(w.a),sn=Math.sin(w.a);
 for(const e of[-1,1]){const ex=h.x+c*r*.35-sn*r*.5*e,ey=h.y+sn*r*.35+c*r*.5*e;
  g.fillStyle='#fff';g.beginPath();g.arc(ex,ey,r*.38,0,TAU);g.fill();
  g.fillStyle='#14102a';g.beginPath();g.arc(ex+c*r*.12,ey+sn*r*.12,r*.18,0,TAU);g.fill()}
 g.font=`${Math.max(13,r*.9)}px Oswald,Impact,sans-serif`;g.textAlign='center';g.fillStyle='#fff';
 g.fillText(w.name,h.x,h.y-r*1.8);g.globalAlpha=1}

function draw(){
 const z=cam.z;
 g.setTransform(D,0,0,D,0,0);g.fillStyle='#0b0620';g.fillRect(0,0,W,H);
 g.setTransform(D*z,0,0,D*z,D*(W/2-cam.x*z),D*(H/2-cam.y*z));

 g.beginPath();g.arc(0,0,ARENA,0,TAU);g.fillStyle='#1c0f40';g.fill();
 g.save();g.clip();g.strokeStyle='rgba(90,255,150,.07)';g.lineWidth=2;g.beginPath();
 const x0=Math.floor((cam.x-W/2/z)/120)*120,y0=Math.floor((cam.y-H/2/z)/120)*120,x1=cam.x+W/2/z,y1=cam.y+H/2/z;
 for(let x=x0;x<=x1;x+=120){g.moveTo(x,y0);g.lineTo(x,y1)}
 for(let y=y0;y<=y1;y+=120){g.moveTo(x0,y);g.lineTo(x1,y)}
 g.stroke();g.restore();
 g.lineWidth=10;g.strokeStyle='#39ff6a';g.beginPath();g.arc(0,0,ARENA+5,0,TAU);g.stroke();
 const hw=W/2/z+40,hh=H/2/z+40;
 for(const f of foods){if(Math.abs(f.x-cam.x)>hw||Math.abs(f.y-cam.y)>hh)continue;
  const fr=4+Math.min(8,f.v*2.2);g.fillStyle=COL[f.ci];g.globalAlpha=.28;g.beginPath();g.arc(f.x,f.y,fr+4,0,TAU);g.fill();g.globalAlpha=1;g.beginPath();g.arc(f.x,f.y,fr,0,TAU);g.fill()}
 for(const w of[...worms].sort((a,b)=>a.len-b.len))if(w!==me)drawWorm(w);
 if(me&&me.alive)drawWorm(me);
 g.globalAlpha=1;g.setTransform(D,0,0,D,0,0);
 mini()}

function mini(){
 mg.clearRect(0,0,260,260);const s=124/ARENA;
 for(const w of worms){const h=w.segs[0];mg.fillStyle=w===me?'#fff':COL[w.ci];
  mg.beginPath();mg.arc(130+h.x*s,130+h.y*s,w===me?6:3.5,0,TAU);mg.fill()}}

/* ---------- boot ---------- */
reset();
let last=performance.now();
(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)})(last);
})();
</script></body></html>
